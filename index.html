<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>SULTAN TAP v7 - BANK SULTAN</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
body{background:#000;color:#0f0;font-family:'Courier New';text-align:center;padding:10px}
.btn{padding:10px 18px;margin:4px;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:bold}
.chain-btn{background:#111;color:#0f0;border:1px solid #0f0}.chain-btn.active{background:#0f0;color:#000}
#tapBtn{background:radial-gradient(circle,#ff0044,#000);color:#fff;font-size:22px;padding:25px 50px;border-radius:50%;border:3px solid #0f0}
.box{background:#0a0a0a;padding:12px;margin:8px;border-radius:8px;border:1px solid #333}
.buy{background:#00ff00;color:#000}.sell{background:#ff0044;color:#fff}
input{background:#111;color:#0f0;border:1px solid #0f0;padding:6px;width:100px;text-align:center}
.rate{color:#ffaa00;font-size:12px}
</style>
</head>
<body>

<h1>🏦 BANK SULTAN v7 🏦</h1>

<div>
  <button class="btn chain-btn active" onclick="switchChain('bsc')">BSC</button>
  <button class="btn chain-btn" onclick="switchChain('polygon')">POLY</button>
  <button class="btn chain-btn" onclick="switchChain('xlm')">XLM</button>
</div>

<button class="btn" id="connectBtn" onclick="connectWallet()">Connect Wallet</button>

<div class="box">
  <h3>SALDO GAME: <span id="gameSaldo">0</span> GRD</h3>
  <p>Per Tap: <span id="perTap">1</span> GRD | Gas: <span id="gasInfo">~Rp 1200</span></p>
</div>

<button class="btn" id="tapBtn" onclick="manualTap()">TAP</button>
<button class="btn" id="autoTap" onclick="toggleAuto()">AUTO TAP: OFF</button>

<div class="box">
  <h4>BOOST</h4>
  <button class="btn" onclick="buyBoost(2)">x2 - 1000</button>
  <button class="btn" onclick="buyBoost(5)">x5 - 5000</button>
  <button class="btn" onclick="buyBoost(10)">x10 - 20000</button>
</div>

<div class="box">
  <h4>💱 EXCHANGER P2P 💱</h4>
  <p class="rate">RATE: BELI 1 BNB = 1.000.000 GRD | JUAL 1jt GRD = 0.95 BNB</p>
  <p>SELISIH 5% MASUK KE KAMU BOS</p>
  <input type="number" id="jumlahGRD" placeholder="Jumlah GRD" value="1000000">
  <br>
  <button class="btn buy" onclick="beliGRD()">BELI GRD PAKE BNB</button>
  <button class="btn sell" onclick="jualGRD()">JUAL GRD KE BNB</button>
</div>

<div class="box">
  <h4>AUTO CLAIM</h4>
  <p>Claim otomatis jika >= <input type="number" id="targetClaim" value="1000000"> GRD</p>
  <button class="btn" id="autoClaim" onclick="toggleAutoClaim()">AUTO CLAIM: OFF</button>
</div>

<p id="status">Siap Gas Bos</p>

<script>
let provider, signer, account, gameBalance = 0, multiplier = 1, autoTapInterval;
let currentChain = 'bsc', autoClaimOn = false;

const RATE_BELI = 1000000; // 1 BNB = 1jt GRD
const RATE_JUAL = 950000; // 0.95 BNB = 1jt GRD. Selisih 5%

const chains = {
  bsc: {name:"BSC", chainId:"0x38", gas:"~Rp 1200"},
  polygon: {name:"POLYGON", chainId:"0x89", gas:"~Rp 200"},
  xlm: {name:"XLM", chainId:"xlm", gas:"~Rp 0.2"}
}

function switchChain(chain){ currentChain = chain; document.querySelectorAll('.chain-btn').forEach(b=>b.classList.remove('active')); event.target.classList.add('active'); document.getElementById('gasInfo').innerText = chains[chain].gas; }

async function connectWallet(){ if(currentChain==='xlm'){alert("XLM Input Alamat Manual");return;} provider=new ethers.providers.Web3Provider(window.ethereum); await provider.send("eth_requestAccounts",[]); await provider.send("wallet_switchEthereumChain",[{chainId:chains[currentChain].chainId}]); signer=provider.getSigner(); account=await signer.getAddress(); document.getElementById('connectBtn').innerText="✅ Terhubung"; }

function manualTap(){ gameBalance += multiplier; document.getElementById('gameSaldo').innerText = gameBalance.toLocaleString(); checkAutoClaim(); }

function toggleAuto(){ let btn=document.getElementById('autoTap'); if(autoTapInterval){clearInterval(autoTapInterval);autoTapInterval=null;btn.innerText="AUTO TAP: OFF";} else{autoTapInterval=setInterval(manualTap,70);btn.innerText="AUTO TAP: ON";} }

function toggleAutoClaim(){ autoClaimOn=!autoClaimOn; let btn=document.getElementById('autoClaim'); btn.innerText=autoClaimOn?"AUTO CLAIM: ON":"AUTO CLAIM: OFF"; }

function checkAutoClaim(){ let target=parseInt(document.getElementById('targetClaim').value); if(autoClaimOn && gameBalance>=target){ alert("AUTO CLAIM "+gameBalance.toLocaleString()+" GRD"); gameBalance=0;document.getElementById('gameSaldo').innerText=0; } }

function buyBoost(x){ let harga=x*500; if(gameBalance>=harga){gameBalance-=harga;multiplier=x;document.getElementById('perTap').innerText=x;document.getElementById('gameSaldo').innerText=gameBalance.toLocaleString();}else{alert("GRD Kurang")} }

// FITUR BANK SULTAN
function beliGRD(){
  let bnb = parseFloat(document.getElementById('jumlahGRD').value) / RATE_BELI;
  alert("KIRIM "+bnb+" BNB ke WALLET KAMU\nNanti dapat "+document.getElementById('jumlahGRD').value+" GRD\n\n[INI SIMULASI. NANTI HUBUNGIN KE SMART CONTRACT]");
}

function jualGRD(){
  let jml = parseFloat(document.getElementById('jumlahGRD').value);
  if(gameBalance >= jml){
    let bnb = jml / RATE_JUAL;
    gameBalance -= jml;
    document.getElementById('gameSaldo').innerText = gameBalance.toLocaleString();
    alert("BERHASIL JUAL "+jml.toLocaleString()+" GRD\nDAPAT "+bnb+" BNB\nSELISIH 5% UNTUNG BUAT KAMU BOS 🤣");
  }else{ alert("GRD GAME KURANG BOS"); }
}
</script>

</body>
</html>
